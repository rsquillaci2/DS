name: Ingestão Diária — Precatórios Pipeline

on:
  schedule:
    # Roda diariamente às 06:00 UTC (03:00 BRT)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Permite execução manual

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: precatorios-pipeline
        run: pip install -r requirements.txt

      - name: Create .env
        working-directory: precatorios-pipeline
        run: |
          echo "DATAJUD_API_KEY=${{ secrets.DATAJUD_API_KEY }}" > .env
          echo "DUCKDB_PATH=data/precatorios.duckdb" >> .env
          echo "LOG_LEVEL=INFO" >> .env
          echo "LOG_FORMAT=json" >> .env

      - name: Initialize database
        working-directory: precatorios-pipeline
        run: python db.py

      - name: Download SOF data
        working-directory: precatorios-pipeline
        run: |
          mkdir -p data
          for year in 2022 2023 2024 2025 2026; do
            wget -q --timeout=120 \
              "https://www1.siop.planejamento.gov.br/siopdoc/lib/exe/fetch.php/dados_abertos:sentencas:expedidos_${year}.csv" \
              -O "data/expedidos_${year}.csv" || true
          done

      - name: Run SOF ingest
        working-directory: precatorios-pipeline
        run: python ingest/load_local_csvs.py

      - name: Run CVM FIDC ingest
        working-directory: precatorios-pipeline
        run: python ingest/cvm_fidc.py

      - name: Run DJEN ingest
        working-directory: precatorios-pipeline
        run: python ingest/djen.py

      - name: Run DataJud ingest
        working-directory: precatorios-pipeline
        run: python ingest/datajud.py

      - name: Run normalization
        working-directory: precatorios-pipeline
        run: python transform/normalize.py

      - name: Upload DuckDB artifact
        uses: actions/upload-artifact@v4
        with:
          name: precatorios-db-${{ github.run_number }}
          path: precatorios-pipeline/data/precatorios.duckdb
          retention-days: 7
